name: Test

on:
  schedule:
    # run test every day at 3:30 AM
    - cron: "30 3 */1 * *"
  push:
    branches:
name: Test

# … (triggers, concurrency, matrix unchanged)

jobs:
  test:
    # … (matrix section unchanged)

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version_python }}
          cache: 'pip'

      - name: Install project, extras and pytest-profiling
        run: |
          pip install .[${{ matrix.extra }}]
          pip install pytest-profiling              # <-- add this line

      - name: Run pytest (coverage + profiling)
        run: |
          python -m pytest -v \
            --cov=deepinv \
            --junitxml=junit.xml -o junit_family=legacy \
            --profile                                # <-- enables cProfile; writes prof/combined.prof

      - name: Upload combined.prof
        if: ${{ always() }}                          # still upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: combined-prof-${{ matrix.os }}
          path: prof/combined.prof                   # default output from pytest-profiling

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1n-version: ${{ matrix.version_python }}
          cache: 'pip' # caching pip dependencies

      - name: Install deepinv and its dependencies
        run: |
          pip install .[${{ matrix.extra }}]

      - name: Test with pytest and generate coverage report
        run: |
          python3 -m pytest --cov=deepinv --junitxml=junit.xml -o junit_family=legacy -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1


